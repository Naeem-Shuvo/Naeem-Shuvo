name: 🏆 Generate Trophies

on:
  schedule:
    - cron: "30 0 * * *"        # daily at 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trophy.yml"

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Create output folder
        run: mkdir -p dist

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Naeem-Shuvo
          output_path: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate the SVG wherever the action actually wrote it
        run: |
          if [ ! -s dist/trophy.svg ]; then
            echo "dist/trophy.svg missing — searching the workspace..."
            found=$(find "$GITHUB_WORKSPACE" -name 'trophy.svg' -not -path '*/dist/*' | head -n 1)
            if [ -n "$found" ]; then
              echo "Found at: $found"
              mv "$found" dist/trophy.svg
            fi
          fi
          if [ ! -s dist/trophy.svg ]; then
            echo "::error::No trophy.svg was produced. Check the 'Generate trophy SVG' step logs above."
            exit 1
          fi
          ls -la dist/

      - name: Push trophy to its own output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-trophy
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
