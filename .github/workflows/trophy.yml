name: 🏆 Generate Trophies

on:
  schedule:
    - cron: "30 0 * * *"        # daily at 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trophy.yml"

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Create output folder
        run: mkdir -p dist

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Naeem-Shuvo
          file: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the SVG was produced
        run: |
          if [ ! -s dist/trophy.svg ]; then
            echo "::error::dist/trophy.svg was not created. Check the 'Generate trophy SVG' step logs above."
            exit 1
          fi
          ls -la dist/

      - name: Push trophy to its own output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-trophy
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
